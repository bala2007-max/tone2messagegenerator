services:
  - type: web
    name: tone-generator-app
    env: python
    buildCommand: "pip install -r requirements.txt && cd frontend-react && npm install && npm run build"
    startCommand: "gunicorn backend.app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: GEMINI_API_KEY
        sync: false
